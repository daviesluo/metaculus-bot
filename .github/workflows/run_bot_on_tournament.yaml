name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *" # every 20 minutes, off the hour. A question already forecast is skipped.

# One run at a time: a run that overruns makes the next one wait, never run beside it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      # Which questions have already failed, so that a broken one is tried twice and then left (and reported).
      - name: Restore the attempt record
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-
      - name: Run bot
        id: bot
        # Prints which questions were forecast and what was spent; never a forecast. Exits non-zero (a failed run,
        # which GitHub reports) when a question failed or the budget does not cover the questions left.
        run: uv run python run_bot.py --mode tournament
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
      - name: Save the attempt record
        if: always() && steps.bot.outputs.state_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .state
          key: bot-state-${{ github.run_id }}
