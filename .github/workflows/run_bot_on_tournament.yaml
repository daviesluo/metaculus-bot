name: Forecast on new AI tournament questions

# A tournament question is open for three hours, so the bot has to look often and without fail. GitHub's own schedule
# is not that: on this fork it started no run at all for hours. So a run looks for new questions every 15 minutes for
# about 50 minutes, and the next run is started by this one: early, so that it waits behind this run and takes over
# even if this run dies. The schedule below is only a second restart: a scheduled run does nothing while another run
# is at work, and starts the chain again when none is.
#
# Each look uses the newest commit of main, so a change to bot_config.py takes effect within 15 minutes.
# To stop the bot: set LIVE = False in bot_config.py. The run at work ends at its next look, the waiting one at its
# first, and none follows. To start it again: LIVE = True, then "Run workflow", leaving "chained" false.
on:
  workflow_dispatch:
    inputs:
      chained:
        description: "Set by the run before this one. Leave it false when starting by hand."
        default: "false"
  schedule:
    - cron: "5,25,45 * * * *"

permissions:
  contents: read
  actions: write # to start the next run, and to see whether another one is at work

jobs:
  # A run started by the schedule or by hand goes ahead only when no other run of this workflow is at work.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CHAINED: ${{ inputs.chained }}
        run: |
          if [ "$CHAINED" = "true" ]; then
            echo "Started by the run before it."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          others=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/run_bot_on_tournament.yaml/runs?per_page=30" \
            --jq "[.workflow_runs[] | select(.status != \"completed\" and .id != $GITHUB_RUN_ID)] | length") || others="unknown"
          if [ "$others" = "0" ]; then
            echo "No other run is at work: this one starts the chain."
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Other runs at work: $others. Nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  forecast_job:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    # One at a time: the next run waits here until this one has finished.
    concurrency:
      group: forecast
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      # Which questions have already failed, so that a broken one is tried twice and then left (and reported).
      - name: Restore the attempt record
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-
      - name: Is the bot launched
        id: live
        run: echo "live=$(uv run python -c 'import bot_config; print(bot_config.LIVE)')" >> "$GITHUB_OUTPUT"
      - name: Start the next run, to wait behind this one
        if: steps.live.outputs.live == 'True'
        continue-on-error: true # the last step tries again
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/next_run.sh
      - name: Run bot
        id: bot
        # Each look prints which questions were forecast and what was spent; never a forecast. The step fails (a red
        # run) when a question failed or the budget does not cover the questions left, after the last look.
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # The news search: one key, or a client id and secret (used in preference when both are set). With neither
          # working the bot forecasts on its web research alone, and uses the news search again once one works.
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
        run: |
          end=$(( $(date +%s) + 3000 ))
          rc=0
          while :; do
            git fetch -q origin main && git reset -q --hard FETCH_HEAD || echo "The newest commit could not be fetched: this look uses the last one."
            live=$(uv run python -c 'import bot_config; print(bot_config.LIVE)')
            echo "live=$live" >> "$GITHUB_OUTPUT"
            date -u +"look at %Y-%m-%d %H:%M UTC, commit $(git rev-parse --short HEAD)"
            timeout 45m uv run python run_bot.py --mode tournament || rc=1
            [ "$live" = "True" ] || break
            [ $(( $(date +%s) + 900 )) -lt "$end" ] || break
            sleep 900
          done
          exit $rc
      - name: Save the attempt record
        if: always() && steps.bot.outputs.state_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .state
          key: bot-state-${{ github.run_id }}
      - name: Make sure the next run is there
        if: ${{ !cancelled() && steps.bot.outputs.live == 'True' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/next_run.sh
