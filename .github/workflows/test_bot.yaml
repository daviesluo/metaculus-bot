name: Test Bot

# Manual only. Three kinds of test, none on an open tournament question, and a count:
#   backtest        forecast CLOSED tournament questions as of their opening and score them against their resolutions,
#                   beside the template's default bot. Publishes nothing.
#   test_questions  publish on Metaculus' bot-testing area (not a prize tournament), to prove the publishing path.
#   selftest        offline checks of the bot's arithmetic. No key is used.
#   status          how many questions MiniBench and the season hold, by status. Reads no forecast, spends nothing.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "backtest, test_questions, selftest or status"
        default: "backtest"
      n:
        description: "How many questions"
        default: "6"
      profile:
        description: "backtest: the bot's profile (lean or standard)"
        default: "lean"
      tournament:
        description: "backtest: polymarket (resolved markets), or Metaculus tournaments tried in turn (season, minibench, cup, summer, or ids)"
        default: "polymarket"
      baseline:
        description: "backtest: also run the template's default bot (true or false)"
        default: "true"
      max_usd:
        description: "backtest: stop opening questions past this spend, in dollars"
        default: "1.0"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  test_job:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run the test
        run: |
          uv run python run_bot.py --mode "$MODE" --n "$N" --profile "$PROFILE" --tournament "$TOURNAMENT" \
            --max-usd "$MAX_USD" $([ "$BASELINE" = "true" ] || echo --no-baseline) --out backtest_results.json
        env:
          MODE: ${{ inputs.mode }}
          N: ${{ inputs.n }}
          PROFILE: ${{ inputs.profile }}
          TOURNAMENT: ${{ inputs.tournament }}
          BASELINE: ${{ inputs.baseline }}
          MAX_USD: ${{ inputs.max_usd }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backtest_results.json
          if-no-files-found: ignore
          retention-days: 90
